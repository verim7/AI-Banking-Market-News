name: Weekly digest

# The weekly AI banking brief, by email. See docs/weekly-digest.md.
#
#   Every morning 06:52   the daily grading Routine grades new articles and
#                         publishes them to the dashboard.
#   Tuesday 08:37 Zurich  the brief Routine writes data/digest/<week>.json (the
#                         summary), runs mode `check`, then mode `draft`: the
#                         issue is stored in D1 for review and a preview goes
#                         to the editor.
#   Tuesday 16:47 UTC     fallback: if nothing was drafted, draft the issue
#                         without a summary.
#   Tuesday, any time     the editor reviews the draft in the tracker (Review
#                         Queue), leaves out what should not go, and approves.
#   Wednesday 05:47 UTC   mode `send`: the approved email, byte for byte, to
#                         the list. Nothing approved means nothing sent, and
#                         the editor gets a note saying so.
#
# What the brief contains is set in data/digest/rules.json (data/digest/RULES.md).
#
# This workflow calls no model and holds no model key. The summary is written
# by the Routine in a Claude Code session and arrives here as a committed file,
# exactly as review grades do.
#
# Addresses live in secrets only. The repository is public, and so are
# workflow inputs, run logs and committed files.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview: build only | facts: print the issue data to the log | check: validate this week''s summary | draft: store it for review and mail the editor | send: mail the approved issue to the list | test-send: mail the approved issue to the editor only | calendar: mail the editor the weekly calendar entries'
        type: choice
        options: [preview, facts, check, draft, send, test-send, calendar]
        default: preview
      as_of:
        description: 'Issue date, YYYY-MM-DD. Blank for today.'
        type: string
        default: ''
  schedule:
    - cron: '47 16 * * 2'   # Tuesday fallback draft, after the brief Routine
    - cron: '47 5 * * 3'    # Wednesday send, of what the editor approved

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  DIGEST_TEST_TO: ${{ secrets.DIGEST_TEST_TO }}
  DIGEST_TO: ${{ secrets.DIGEST_TO }}
  DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
  # Optional: who a colleague writes to about a password. Defaults to DIGEST_TEST_TO.
  DIGEST_CONTACT: ${{ secrets.DIGEST_CONTACT }}
  DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Decide what this run does
        id: what
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "47 5 * * 3" ]; then
              echo "args=--mode=send" >> "$GITHUB_OUTPUT"
            else
              echo "args=--mode=draft --if-missing" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "args=--mode=${{ inputs.mode }} ${{ inputs.as_of != '' && format('--as-of={0}', inputs.as_of) || '' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, and mail if asked
        run: npm run digest -- ${{ steps.what.outputs.args }} --out=digest-preview.html 2>&1 | tee digest.log

      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('digest-preview.html') != ''
        with:
          name: digest-preview
          path: |
            digest-preview.html
            digest-preview.txt
          retention-days: 30

      - name: Report
        if: always()
        run: |
          {
            echo "### Weekly digest"
            echo
            echo '```'
            tail -n 12 digest.log 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
