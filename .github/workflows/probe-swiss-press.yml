name: Probe Swiss press pages

# Can a daily crawl of Swiss bank newsrooms be built, and for how many of them?
#
# A measurement, not a change: it writes nothing, touches no database and needs
# no secrets. It exists as a workflow because a remote Claude Code session has
# no egress to publisher hosts — the proxy refuses them — while an Actions
# runner reaches them.
#
# The number it prints decides how much of docs/swiss-coverage.md is buildable.

on:
  workflow_dispatch:

concurrency:
  group: probe-swiss-press
  cancel-in-progress: false

# Every `run:` step uses bash with `-o pipefail`.
#
# Not cosmetic. Steps here pipe a command into `tee` so the log is both shown
# and saved, and a bash pipeline reports the exit status of its LAST command —
# `tee`, which always succeeds. So a failing command inside a pipe produced a
# GREEN step.
#
# That is not hypothetical: review-apply refused an invalid batch, printed
# "Nothing was written. Fix the records above and run again.", set exit code 1,
# and the workflow reported success. Forty-three gradings were believed applied
# for a day and were not. `shell: bash` is GitHub's documented shorthand for
# `bash --noprofile --norc -eo pipefail`, which makes the pipe honest.
defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Probe
        run: |
          node --experimental-strip-types --no-warnings \
            packages/ingest/src/probe-swiss-press.ts \
            2>&1 | tee swiss-press.log

      - name: Report
        if: always()
        run: |
          {
            echo "### Swiss bank newsrooms, as a daily source"
            echo
            echo '```'
            cat swiss-press.log 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
