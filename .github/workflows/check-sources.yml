name: Check sources

# Fetches every source and reports what each one actually returned.
#
# Nothing is written to the database. This exists because a source list is a
# set of claims about the outside world, and the only honest way to hold them
# is to check them where the fetching really happens — the authoring sandbox
# blocks every news host, so a source verified there is a source verified
# nowhere. Twenty dead feeds in this repository came from exactly that.
#
# Read the yield column, not the item count. A feed can return fifty items a
# day and none about AI in banking; the second number is the one that decides
# whether a source is worth keeping.

on:
  workflow_dispatch:
  schedule:
    # Weekly, a few hours after the daily ingest, so a feed that dies is
    # noticed within a week instead of whenever someone happens to look.
    - cron: '40 7 * * 1'

concurrency:
  group: check-sources
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # RSS first, and on its own. These are the sources that go stale — a
      # publisher retires a feed and nothing says so — and they all answer in
      # seconds. Keeping them ahead of GDELT means the answer that matters
      # arrives even if the rate-limited half of the run never finishes.
      - name: Check the feeds
        run: |
          set -o pipefail
          npm run ingest -- --check --only rss 2>&1 | tee check-rss.log

      # GDELT paces itself to thirty seconds a request and widens when refused,
      # so this half is slow by design and allowed to fail without taking the
      # feed results down with it.
      - name: Check the GDELT queries
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -o pipefail
          npm run ingest -- --check --only gdelt 2>&1 | tee check-gdelt.log

      - name: Report
        if: always()
        run: |
          {
            echo "### Source check"
            echo
            echo "Yield / fetched, per source. Yield is how many items passed the"
            echo "AI-in-banking gate — the number that decides whether a source earns its place."
            echo
            echo "#### Feeds"
            echo '```'
            sed -n '/Sources by yield/,$p' check-rss.log 2>/dev/null | head -n 160
            echo '```'
            echo "#### GDELT queries"
            echo '```'
            sed -n '/Sources by yield/,$p' check-gdelt.log 2>/dev/null | head -n 60 \
              || echo "GDELT half did not finish — rate limited."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-check
          path: |
            check-rss.log
            check-gdelt.log
          retention-days: 30
