name: Check sources

# Fetches every source and reports what each one actually returned.
#
# Nothing is written to the database. This exists because a source list is a
# set of claims about the outside world, and the only honest way to hold them
# is to check them where the fetching really happens — the authoring sandbox
# blocks every news host, so a source verified there is a source verified
# nowhere. Twenty dead feeds in this repository came from exactly that.
#
# Read the yield column, not the item count. A feed can return fifty items a
# day and none about AI in banking; the second number is the one that decides
# whether a source is worth keeping.
#
# Two jobs rather than two steps, and that distinction is the whole point.
# GDELT paces itself to thirty seconds a request and widens when refused, so
# its half can outlast everything else put together — and as steps in one job,
# a hung GDELT step withholds the finished feed report, which is the half
# anyone actually needs. As separate jobs the feed result publishes in seconds
# no matter what GDELT is doing.

on:
  workflow_dispatch:
  schedule:
    # Weekly, a few hours after the daily ingest, so a feed that dies is
    # noticed within a week instead of whenever someone happens to look.
    - cron: '40 7 * * 1'

concurrency:
  group: check-sources
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # The feeds are what go stale: a publisher retires RSS and nothing says so.
  # They all answer in seconds.
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Check the feeds
        run: |
          set -o pipefail
          npm run ingest -- --check --only rss 2>&1 | tee check-rss.log

      - name: Report
        if: always()
        run: |
          {
            echo "### Feeds"
            echo
            echo "Yield / fetched per source. Yield is how many items passed the"
            echo "AI-in-banking gate — the number that decides whether a source earns its place."
            echo
            echo '```'
            sed -n '/Sources by yield/,$p' check-rss.log 2>/dev/null | head -n 200 \
              || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-feeds
          path: check-rss.log
          retention-days: 30

      # The ranking answers a different question from the check above. The
      # check says what a source returned this morning; this says what it has
      # contributed over the whole archive — which is the question worth
      # asking before adding or dropping one.
      - name: Rank the sources on everything collected so far
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: npm run rank-sources

      - name: Publish and commit the ranking
        run: |
          {
            echo "### Source quality"
            echo
            sed -n '/^| # |/,/^$/p' docs/source-quality.md
            echo
            sed -n '/Candidates to drop/,$p' docs/source-quality.md
          } >> "$GITHUB_STEP_SUMMARY"

          git config user.name  "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/
          if git diff --cached --quiet -- docs/; then
            echo "Ranking unchanged."
            exit 0
          fi
          git commit -m "Source quality ranking ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin main
          git push

  # Why GDELT is unreachable, when it is.
  #
  # Fast, and the first thing to read when the gdelt job below fails: it
  # separates DNS from egress from the API being down, which "fetch failed"
  # does not. Its own job so a slow GDELT check cannot withhold it.
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Diagnose GDELT reachability
        run: |
          set -o pipefail
          node --experimental-strip-types --no-warnings \
            packages/ingest/src/diagnose-gdelt.ts 2>&1 | tee diagnose.log

      - name: Report
        if: always()
        run: |
          {
            echo "### GDELT reachability"
            echo
            echo '```'
            cat diagnose.log 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Slow by design and allowed to fail. The daily ingest already exercises
  # these queries; this job exists to show what they yield, not to gate.
  gdelt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Check the GDELT queries
        continue-on-error: true
        run: |
          set -o pipefail
          npm run ingest -- --check --only gdelt 2>&1 | tee check-gdelt.log

      - name: Report
        if: always()
        run: |
          {
            echo "### GDELT queries"
            echo
            echo '```'
            sed -n '/Sources by yield/,$p' check-gdelt.log 2>/dev/null | head -n 80 \
              || echo "GDELT did not finish — rate limited. The daily ingest is unaffected."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-gdelt
          path: check-gdelt.log
          retention-days: 30
