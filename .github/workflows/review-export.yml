name: Review step 1 — export the unreviewed articles

# Writes the articles that still need reading out to a file and commits it.
#
# STEP 1 OF 3, and on its own it changes nothing anyone can see. Reviewing is
# three steps and the middle one is not a button:
#
#   1. this workflow  — list the articles nobody has graded yet
#   2. Claude, in a chat session — actually read them and write the grades
#   3. "Review step 3" — write those grades to the database
#
# Running step 3 without steps 1 and 2 succeeds and does nothing, because there
# are no new grades to write. That happened, and the names were the reason.
#
# This workflow calls no model and needs no model key. It only moves data: the
# reading happens in a Claude Code session, and `Apply AI review` writes the
# result back. Nothing here runs on a schedule.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many articles to export (one review pass is ~80)'
        type: string
        default: '80'
      since:
        description: 'Only articles published on or after this date (YYYY-MM-DD). Blank for no limit.'
        type: string
        default: ''

concurrency:
  group: review
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Export
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run review:export -- \
            --limit=${{ inputs.limit }} \
            ${{ inputs.since != '' && format('--since={0}', inputs.since) || '' }} \
            2>&1 | tee export.log

      - name: Commit the batch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/review/pending.jsonl
          git diff --cached --quiet || git commit -m "Review batch for $(date -u +%F)"
          git push

      - name: Report
        run: |
          {
            echo "### Exported for review"
            echo
            echo '```'
            tail -n 8 export.log 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
