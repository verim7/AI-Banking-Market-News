name: Measure URL resolution

# Can GDELT give us the publisher URL that Google News withholds?
#
# A measurement, not a change: it writes nothing, touches no database and needs
# no secrets. It exists as a workflow because a remote Claude Code session has
# no egress — its proxy refuses GDELT and publishers alike — while an Actions
# runner reaches both, which is where the corpus's article bodies came from.
#
# The number it prints decides whether a GDELT resolver is worth building.

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'How many stuck articles to probe (newest first)'
        type: string
        default: '60'
      days:
        description: 'Days either side of the publish date to search'
        type: string
        default: '3'

concurrency:
  group: measure-resolution
  cancel-in-progress: false

# Every `run:` step uses bash with `-o pipefail`.
#
# Not cosmetic. Steps here pipe a command into `tee` so the log is both shown
# and saved, and a bash pipeline reports the exit status of its LAST command —
# `tee`, which always succeeds. So a failing command inside a pipe produced a
# GREEN step.
#
# That is not hypothetical: review-apply refused an invalid batch, printed
# "Nothing was written. Fix the records above and run again.", set exit code 1,
# and the workflow reported success. Forty-three gradings were believed applied
# for a day and were not. `shell: bash` is GitHub's documented shorthand for
# `bash --noprofile --norc -eo pipefail`, which makes the pipe honest.
defaults:
  run:
    shell: bash

jobs:
  measure:
    runs-on: ubuntu-latest
    # GDELT is paced from inside the client, so a large sample takes real time.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Probe
        run: |
          node --experimental-strip-types --no-warnings \
            packages/ingest/src/measure-resolution.ts \
            --sample=${{ inputs.sample }} --days=${{ inputs.days }} \
            2>&1 | tee measure.log

      - name: Report
        if: always()
        run: |
          {
            echo "### GDELT as a URL resolver"
            echo
            echo '```'
            tail -n 40 measure.log 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
