name: Apply AI review

# Writes reviewed use cases from data/review/decisions/*.jsonl into D1.
#
# Validates the whole batch first and refuses to write anything if one record
# is wrong: a half-applied file leaves the database in a state no file
# describes, which is worse than not applying it at all.
#
# Like the export, this calls no model and needs no model key.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and report without writing'
        type: boolean
        default: false

concurrency:
  group: review
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Apply
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run review:apply -- ${{ inputs.dry_run && '--dry-run' || '' }} 2>&1 | tee apply.log

      - name: Commit the ledger
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/review/reviewed.json
          git diff --cached --quiet || git commit -m "Reviewed-article ledger"
          git push

      - name: Report
        if: always()
        run: |
          {
            echo "### Apply AI review"
            echo
            echo '```'
            tail -n 15 apply.log 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
