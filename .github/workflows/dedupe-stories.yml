name: Collapse duplicate stories

# Marks articles that re-report a story already in the archive.
#
# One rollout arrived as eight rows from eight outlets, whose headlines differ
# enough that neither the URL key nor the title key saw them as related. This
# clusters what is already stored on the story key — institution, ISO week, and
# either the figure or the process.
#
# Marks; never deletes. The clustering is a heuristic, so a wrong call has to be
# undoable by clearing one column. Run with dry_run first to read the clusters.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the clusters without writing anything'
        type: boolean
        default: true

concurrency:
  group: dedupe-stories
  cancel-in-progress: false

# Every `run:` step uses bash with `-o pipefail`.
#
# Not cosmetic. Steps here pipe a command into `tee` so the log is both shown
# and saved, and a bash pipeline reports the exit status of its LAST command —
# `tee`, which always succeeds. So a failing command inside a pipe produced a
# GREEN step.
#
# That is not hypothetical: review-apply refused an invalid batch, printed
# "Nothing was written. Fix the records above and run again.", set exit code 1,
# and the workflow reported success. Forty-three gradings were believed applied
# for a day and were not. `shell: bash` is GitHub's documented shorthand for
# `bash --noprofile --norc -eo pipefail`, which makes the pipe honest.
defaults:
  run:
    shell: bash

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Cluster
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run dedupe-stories -- ${{ inputs.dry_run && '--dry-run' || '' }} 2>&1 | tee dedupe.log

      - name: Report
        if: always()
        run: |
          {
            echo "### Duplicate stories"
            echo
            echo '```'
            head -n 60 dedupe.log 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
