name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (offline, no network)
        run: npm test

      # Known-vulnerable dependencies, as a build step rather than as something
      # a person remembers to run. Scoped to what actually ships: a advisory in
      # vitest or wrangler matters for the supply chain but cannot be reached
      # by a request to the deployed Worker, and failing the build on it would
      # train everyone to ignore this step.
      #
      # `xlsx` is the reason this is `--audit-level=high` and not `critical`:
      # SheetJS has an unfixed advisory on npm, so this will stay red until the
      # dependency is replaced. That is the correct amount of noise — it is a
      # real finding, and its reachable path was removed in HilChecker.
      - name: Known vulnerabilities in shipped dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Build the SPA
        run: npm run build:web

      # The step that would have caught the black page. Everything above this
      # line reads the source; this one asks a browser to run the bundle and
      # fails if React does not mount. A build can be clean in every other
      # sense and still be a blank page — that happened, and it reached
      # production because no check here had ever opened it.
      # Without `--with-deps`: the ubuntu runner image already carries the
      # shared libraries Chromium needs, and the apt-get pass that flag adds
      # took seven minutes on its first run — most of this job's budget, spent
      # re-installing what is already there.
      - name: Install a browser for the smoke test
        run: npx playwright install chromium

      - name: The built SPA comes up in a browser
        run: npm run smoke:web

      # Catches a Worker that has grown past the free plan's 3 MiB limit before
      # it fails at deploy time.
      - name: Build the Worker
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-build
