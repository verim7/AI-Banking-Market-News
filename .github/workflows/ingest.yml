name: Ingest news

# Runs daily and writes to D1.
#
#   schedule / manual -> fetch, classify, write to D1, commit a snapshot
#   push              -> fetch, classify, report, write NOTHING
#
# The split means a parser being developed on a branch cannot overwrite good
# data, and a broken feed shows up as a red build rather than as a dashboard
# that has quietly stopped updating.
#
# Both paths write a "Rejected at the gate" block to the run summary page:
# GITHUB_STEP_SUMMARY is set by Actions for every step, so the ingest command
# finds it without being told. That block is the only place what the gate
# *refused* is visible; a vocabulary hole otherwise waits for a reader to
# notice an article that never arrived.

on:
  schedule:
    - cron: '20 4 * * *'   # 04:20 UTC, ahead of European working hours
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'packages/ingest/**'
      - 'packages/shared/**'
      - '.github/workflows/ingest.yml'

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Fetch and report (push only, writes nothing)
        if: github.event_name == 'push'
        run: npm run ingest -- --dry-run

      - name: Fetch, classify and publish
        if: github.event_name != 'push'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          # Optional. Unset means rules-only classification, which is free.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run ingest

      # A second try, in a real browser, at the articles the crawler could
      # only store as a headline (most come through Google News, whose links
      # need JavaScript to reach the publisher). Not logged in anywhere.
      # packages/ingest/src/browser-bodies.ts explains it.
      - name: Install Chromium for the browser step
        run: npx playwright install --with-deps chromium

      - name: Read headline-only articles with Chromium
        if: github.event_name != 'push'
        # A browser step that fails must not cost the day's snapshot below.
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: npm run browser:bodies

      - name: Try the browser step without writing (push only)
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: npm run browser:bodies -- --dry-run --limit=25

      - name: Commit the snapshot if it changed
        if: github.event_name != 'push'
        run: |
          git config user.name  "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first: git diff ignores untracked files, so on the very first
          # run an unstaged check reports "no change" and the snapshot never lands.
          git add -A data/
          if git diff --cached --quiet -- data/; then
            echo "No change in today's snapshot."
            exit 0
          fi
          git commit -m "News snapshot ($(date -u +%Y-%m-%d))"
          git push
