name: Rescore articles

# Re-runs the classifier over every article already in the database.
#
# Nothing is fetched: AI focus, AI type, L1 process, maturity and the quoted
# use case are all derived from the article text, which is already stored. So
# this is the way to apply a classifier change to the archive, and the way to
# repair derived columns if they are ever lost.
#
# Safe to run at any time. It rewrites scores and tags; it never touches the
# articles themselves, and it never deletes one.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would change without writing anything'
        type: boolean
        default: false
      purge_rejected:
        description: 'Also delete archived articles the current rules would reject'
        type: boolean
        default: false

concurrency:
  group: rescore
  cancel-in-progress: false

# Every `run:` step uses bash with `-o pipefail`.
#
# Not cosmetic. Steps here pipe a command into `tee` so the log is both shown
# and saved, and a bash pipeline reports the exit status of its LAST command —
# `tee`, which always succeeds. So a failing command inside a pipe produced a
# GREEN step.
#
# That is not hypothetical: review-apply refused an invalid batch, printed
# "Nothing was written. Fix the records above and run again.", set exit code 1,
# and the workflow reported success. Forty-three gradings were believed applied
# for a day and were not. `shell: bash` is GitHub's documented shorthand for
# `bash --noprofile --norc -eo pipefail`, which makes the pipe honest.
defaults:
  run:
    shell: bash

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Rescore
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          set -o pipefail
          npm run rescore -- \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.purge_rejected && '--purge-rejected' || '' }} 2>&1 | tee rescore.log

      - name: Report
        if: always()
        run: |
          {
            echo "### Rescore"
            echo
            echo '```'
            tail -n 12 rescore.log 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
