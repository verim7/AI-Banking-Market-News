  # ------------------------------------------------------------------- GDELT
  # Free worldwide news API, no key. Each query becomes one source so the
  # Market Lens gets coverage beyond the curated list above.
  - id: gdelt_ai_banking
    # backfill: true means this query is also used when loading history.
    # Only broad queries qualify: a three-year run multiplies every query by
    # ~36 months, and narrow ones spend that budget on results the broad
    # queries already return. Nine queries got the whole run blocked.
    backfill: true
    name: GDELT — AI in banking
    url: '("artificial intelligence" OR "generative AI") (bank OR banking OR "financial services")'
    kind: gdelt
    publisher_kind: media
    region_hint: global

  - id: gdelt_ai_wealth
    backfill: true
    name: GDELT — AI in wealth management
    url: '("artificial intelligence" OR "machine learning") ("wealth management" OR "private banking")'
    kind: gdelt
    publisher_kind: media
    region_hint: global

  # ---------------------------------------------- consultancy coverage via GDELT
  # Most of the big firms retired their public RSS feeds. GDELT indexes them by
  # domain, so their studies are still reachable without a feed. Domains are
  # OR-ed into as few queries as possible: GDELT rate-limits per client, not
  # per query, and every extra source costs another spaced call.
  - id: gdelt_consultancy_big4
    name: GDELT — Big Four on AI in banking
    url: '(domain:deloitte.com OR domain:pwc.com OR domain:ey.com OR domain:kpmg.com) ("artificial intelligence" OR "generative AI") (bank OR banking OR "financial services")'
    kind: gdelt
    publisher_kind: consultancy

  - id: gdelt_consultancy_strategy
    name: GDELT — strategy firms on AI in banking
    url: '(domain:mckinsey.com OR domain:bcg.com OR domain:bain.com OR domain:accenture.com OR domain:oliverwyman.com OR domain:capgemini.com) ("artificial intelligence" OR "generative AI") (bank OR banking OR "financial services")'
    kind: gdelt
    publisher_kind: consultancy

  - id: gdelt_regulators
    name: GDELT — regulators on AI
    url: '(domain:bis.org OR domain:bafin.de OR domain:bundesbank.de OR domain:snb.ch OR domain:occ.gov) ("artificial intelligence" OR "machine learning") (bank OR banking OR supervision)'
    kind: gdelt
    publisher_kind: regulator

  # Singapore & APAC. The MAS and DBS feeds both stopped being feeds, which
  # removed the region from the brief entirely until these were added.
  - id: gdelt_apac
    name: GDELT — AI in APAC banking
    url: '(domain:mas.gov.sg OR domain:dbs.com OR domain:ocbc.com OR domain:uob.com.sg OR Singapore OR "Hong Kong") ("artificial intelligence" OR "generative AI" OR "machine learning") (bank OR banking OR "financial services")'
