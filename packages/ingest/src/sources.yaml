  # ------------------------------- wealth and private banking trade press
  #
  # Suggested by the team, and the right instinct: these titles cover wealth
  # and private banking as their whole beat, so an AI story here is already
  # about a bank doing something. A general title has to be filtered down to
  # that; these start there.
  #
  # Each publication appears twice, deliberately.
  #
  # A Google News site: query is the reliable half. It cannot 404, needs no
  # key, and reaches the publication whether or not it still runs RSS. It also
  # carries when:1y, so it brings a year of history on the first run — RSS
  # publishes a sliding window of the last few days and can never do that.
  #
  # A direct feed is the higher-fidelity half when it works: the publication's
  # own items rather than whatever Google indexed. Those URLs are guesses and
  # are marked as such. This sandbox cannot reach any of these hosts, so the
  # Check sources action decides which survive — guessing feed URLs and
  # committing them unverified is what produced twenty dead 404s in this file.

  - id: gnews_global_private_banker
    name: Google News — Global Private Banker
    url: 'https://news.google.com/rss/search?q=site%3Aglobalprivatebanker.com+%28AI+OR+%22artificial+intelligence%22%29+when%3A1y&hl=en-US&gl=US&ceid=US%3Aen'
