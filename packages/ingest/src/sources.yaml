# News sources, most trusted first.
#
# publisher_kind drives the credibility weight in the classifier:
#   consultancy (1.35) > regulator (1.25) > bank (1.10) > media (1.00)
#
# region_hint is applied when the article text names no region of its own —
# a FINMA circular is about Switzerland whether or not it says so.
#
# Run `npm run ingest -- --check` after editing: it fetches every source and
# reports which ones actually returned parseable items, without writing.
# A source that fails is disabled in place, never allowed to fail the run.

sources:
  # ----------------------------------------------------------- consultancies
