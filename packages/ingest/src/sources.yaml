  # ------------------------------------------------------------- Google News
  #
  # A search index rather than a publisher, and the single largest widening
  # available for free. One request returns matches from Reuters, the FT,
  # American Banker, Finextra, The Banker, Bloomberg headlines and hundreds of
  # trade titles that either publish no feed or publish one nobody can find.
  # Chasing those publishers one at a time is what produced twenty dead feeds
  # in this file; one query reaches all of them and cannot 404.
  #
  # No key, no quota worth worrying about at one request per query per day, and
  # the response is ordinary RSS, so it needs no new fetcher.
  #
  # Query syntax notes, because these are easy to get subtly wrong:
  #   * when:7d bounds the window. Without it the feed drifts months back and
  #     the same stories are re-fetched forever.
  #   * hl/gl/ceid pick the edition. A German edition surfaces Handelsblatt and
  #     Börsen-Zeitung, which the US edition does not carry.
  #   * Quoted phrases are matched as phrases; unquoted words are OR-ish, so
  #     the parenthesised alternations matter.
  #
  # These are deliberately NOT marked backfill: Google News RSS honours no
  # date range beyond when:, so it cannot address a specific past month. GDELT
  # remains the only source that can load history.

  - id: gnews_ai_banking_global
    name: Google News — AI in banking (global)
    url: 'https://news.google.com/rss/search?q=%28%22artificial+intelligence%22+OR+%22generative+AI%22%29+%28bank+OR+banking%29+when%3A7d&hl=en-US&gl=US&ceid=US%3Aen'
    kind: rss
    publisher_kind: media
    region_hint: global

  - id: gnews_ai_use_case
    # Deployment verbs rather than the topic alone. This is the query aimed at
    # the brief's actual question — banks running AI, not banks discussing it.
    name: Google News — banks deploying AI
    url: 'https://news.google.com/rss/search?q=bank+%28%22rolls+out%22+OR+%22deploys%22+OR+%22goes+live%22+OR+%22launches%22%29+%28%22AI%22+OR+%22artificial+intelligence%22%29+when%3A7d&hl=en-US&gl=US&ceid=US%3Aen'
    kind: rss
