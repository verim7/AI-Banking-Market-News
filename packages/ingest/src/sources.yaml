  # ------------------------------------------------------------------- GDELT
  # Free worldwide news API, no key. Each query becomes one source so the
  # Market Lens gets coverage beyond the curated list above.
  # ---------------------------------------------------------------- GDELT
  #
  # Two queries run daily. One of those also loads history. The other seven are
  # retired, and saying so is the correction to a claim I made and did not
  # check: "all ten remain available to the backfill" was false. Only queries
  # marked `backfill: true` ever were, so setting `daily: false` on the rest
  # put them in no job at all — configuration that looks alive and runs
  # nowhere. A test now fails if any enabled source is in neither job.
  #
  # Retiring them costs nothing that was working. The domain queries were an
  # unverified substitute for dead consultancy feeds and mostly returned
  # nothing, because GDELT indexes news and insight pages are not news. The
  # region queries were redundant from the start: classify() reads the region
  # out of the article text, so a Swiss story arrives tagged switzerland
  # whether or not a Swiss query fetched it.
  #
  # A real run had six of eight refused — 429s and dropped connections — and
  # returned one article for eleven of its twelve minutes. GDELT rations
  # requests per client however they are spaced, so the fix is fewer queries
  # rather than wider gaps. The two kept are the broadest and were the two
  # largest contributors in docs/source-quality.md.
  #
  # The others keep `backfill: true` where they had it and are still available
  # to the history job, where a long wait buys thirty-six months rather than
  # one day.

  - id: gdelt_ai_banking
    # The only query the backfill uses, and the reason is arithmetic.
    #
    # Three queries over 37 months is 111 requests. A real run attempted 40 of
    # them, had 31 refused, and took 57 minutes to walk from 2023-08 to 2024-09
    # — a third of the span, twelve more runs to finish, and eleven hours of a
    # private repository's Actions minutes.
    #
    # Refusals are the binding constraint, not the budget, so more requests buy
    # nothing. One query covers all 37 months inside a single run instead: every
    # month is attempted once, the gaps land spread across three years rather
    # than piled at the far end, and a repeat targets only what was refused.
    #
    # This query is the broadest of the three. The other two return material it
    # largely already covers, and the wealth angle is now covered far better by
    # the Google News queries — 80 on-topic items from 100 for
    # WealthManagement.com alone.
    # DOWN since at least 2026-08-28. api.gdeltproject.org accepts the
    # connection and then resets it — ECONNRESET after ~2.5s — from GitHub
    # Actions runners. Diagnosed rather than guessed: DNS resolves, a control
    # host answers in 76ms, and www.gdeltproject.org answers 200 in 116ms on a
    # different IP, so GDELT is up and its API host is refusing us. Most likely
    # an IP-range block on cloud runners; it cannot be told apart from here.
    #
    # Disabled rather than left failing, because a dead integration now fails
    # the ingest run: leaving it on would paint the daily job red every morning
    # and teach everyone to ignore the signal it was added to give.
    #
    # Re-test by opening this in any browser, phone included, and re-enable if
    # it shows a page of JSON text rather than an error:
    #   https://api.gdeltproject.org/api/v2/doc/doc?query=bank&mode=artlist&format=json&maxrecords=1
    # Or run the "Check sources" workflow, whose diagnose job reports the cause.
    enabled: false
    backfill: true
    name: GDELT — AI in banking
    url: '("artificial intelligence" OR "generative AI") (bank OR banking OR "financial services")'
    kind: gdelt
    publisher_kind: media
    region_hint: global

  - id: gdelt_ai_wealth
    daily: false
    enabled: false   # retired: Google News covers wealth far better — 80 on-topic
                     # items from 100 for WealthManagement.com against this
                     # query's handful, and it is no longer in either job.
    name: GDELT — AI in wealth management
    url: '("artificial intelligence" OR "machine learning") ("wealth management" OR "private banking")'
    kind: gdelt
    publisher_kind: media
    region_hint: global

