name = "ai-banking-market-news"
main = "packages/worker/src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# The built SPA. Static assets are served before the Worker runs and do not
# count against the 3 MiB Worker size limit or the 10 ms CPU budget, which is
# what keeps this app inside the Cloudflare free plan.
[assets]
directory = "packages/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Static assets are served BEFORE the Worker runs, and with the SPA fallback a
# GET for an unknown path returns index.html without the Worker ever seeing it.
# That silently swallowed every GET /api/* — /api/health returned the login
# page. POSTs still reached the Worker (the asset server only handles GET and
# HEAD), which is why logging in produced a real error while the health check
# it pointed at was unreachable.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "portal"
# Replace with the id printed by: wrangler d1 create portal
database_id = "df0a8b0e-dcae-4e3c-9d93-8c7af9d2c0ad"

[observability]
enabled = true

# SESSION_SECRET is a secret, not a var. Set it once with:
#   wrangler secret put SESSION_SECRET
